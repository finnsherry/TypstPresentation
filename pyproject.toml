[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "typst-presentation"
version = "0.1.0"
description = "Compile Touying presentations to HTML, with GIFs replaced by MP4 videos."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["touying"]

[project.scripts]
presentation = "typst_presentation.cli:main"
